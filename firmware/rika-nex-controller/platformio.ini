; RIKA NEX Abbrandregelung – Phase 2: Messung und Logging (noch ohne Regelung)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit MAX31856 library@^1.2.7
    adafruit/Adafruit MAX31865 library@^1.6.2
    adafruit/MAX6675 library@^1.1.2
build_flags =
    -D MQTT_MAX_PACKET_SIZE=1024

; Wemos D1 Mini für erste Tests, mit vorhandenem MAX6675
[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps = ${env:esp32dev.lib_deps}
build_flags =
    -D MQTT_MAX_PACKET_SIZE=1024
    -D TEMP_SENSOR_TYPE=3
