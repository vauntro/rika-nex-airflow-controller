<text x="400" y="520.2" font-size="13" text-anchor="middle" fill="#1f5fa8" font-weight="normal">gerades Blechteil, nur ausgesägt</text>
<text x="119.71999999999997" y="574.8" font-size="13" text-anchor="start" fill="#222" font-weight="normal">Distanzhülse 12 mm</text>
<text x="708.28" y="670" font-size="13" text-anchor="end" fill="#222" font-weight="normal">Schraube: Lasche + 12 mm Hülse + 2 mm Blech + Scheibe + Mutter → M5 × 25–30</text>
<text x="458.8" y="588.88" font-size="12" text-anchor="start" fill="#c0392b" font-weight="normal">Platine</text>
<text x="820" y="140" font-size="14" text-anchor="start" fill="#222" font-weight="normal">A: wie Bauteil H, ein Teil aus deinem Blech,</text>
<text x="820" y="162" font-size="14" text-anchor="start" fill="#222" font-weight="normal">   vier Kanten (je zwei pro Seite), keine Zusatzteile.</text>
<text x="820" y="184" font-size="14" text-anchor="start" fill="#222" font-weight="normal">   Höhe ca. 12 mm ist durch die Kantung fest.</text>
<text x="820" y="206" font-size="14" text-anchor="start" fill="#222" font-weight="normal"></text>
<text x="820" y="228" font-size="14" text-anchor="start" fill="#222" font-weight="normal">B: einfacher zu fertigen (nur sägen, bohren),</text>
<text x="820" y="250" font-size="14" text-anchor="start" fill="#222" font-weight="normal">   braucht aber zwei Hülsen und längere Schrauben.</text>
<text x="820" y="272" font-size="14" text-anchor="start" fill="#222" font-weight="normal">   Höhe änderbar durch andere Hülsen.</text>
<text x="820" y="294" font-size="14" text-anchor="start" fill="#222" font-weight="normal"></text>
<text x="820" y="316" font-size="14" text-anchor="start" fill="#222" font-weight="normal">Bei beiden gleich: Platine auf vier M3-Abstandshaltern,</text>
<text x="820" y="338" font-size="14" text-anchor="start" fill="#222" font-weight="normal">Chip zum Magneten, Stecker durch Fenster nach hinten.</text>
